name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  session-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Session workspace regression tests
        run: npx vitest run src/modules/sessions/SessionTimeline.test.tsx src/components/courts/AdvancedFibaCourt.test.tsx
      - name: Sessions portable suite
        run: npx vitest run src/modules/sessions --exclude "**/*.local.test.*"
      - name: Court component suite
        run: npx vitest run src/components/court src/components/courts
      - name: Performance canonical services
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npx vitest run src/features/coach/playerProgressionService.test.ts src/features/coach/playerEvaluationService.test.ts src/features/coach/playerObjectiveService.test.ts src/features/coach/performanceTestService.test.ts src/features/coach/playerMonitoringService.test.ts src/features/coach/safetyDecisionEngine.test.ts src/features/coach/playerProgramService.test.ts src/features/coach/playerBookAggregation.test.ts src/features/coach/playerBookExportModel.test.ts src/features/coach/playerBookPdfExport.test.ts src/features/coach/playerBookXlsxExport.test.ts src/features/coach/playerBookMonitoringPrivacy.test.ts src/features/coach/playerBookScopeIntegrity.test.ts src/features/coach/playerPerformanceDashboard.test.ts src/features/coach/pages/CoachJoueurProgressionPage.test.tsx
      - name: Internal Player Book regression tests
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npx vitest run src/features/coach/playerStaffBookService.test.ts src/features/coach/playerBookObjectives.test.ts src/features/coach/playerBookEvaluations.test.ts src/features/coach/playerBookPdfLayout.test.ts src/features/coach/playerBookXlsxLayout.test.ts src/features/coach/pages/CoachPlayerBookPage.test.tsx
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Vite production build
        run: npx vite build

  database-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify audited October migration sequence
        run: node scripts/check-october-migration-sequence.mjs
      - name: Setup Supabase CLI
        id: supabase-cli
        uses: supabase/setup-cli@v1
        with:
          version: 2.48.3
      - name: Start local Supabase and apply migrations
        run: supabase start
      - name: Setup Node for security integration
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install security test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Monitoring authorization integration
        run: node scripts/run-monitoring-security-ci.mjs
      - name: Verify migration state
        run: supabase migration list --local
      - name: Stop local Supabase
        if: always() && steps.supabase-cli.outcome == 'success'
        run: supabase stop --no-backup
