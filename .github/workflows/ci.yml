name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Session timeline tests
        run: npx vitest run src/modules/sessions/SessionTimeline.test.tsx
      - name: Court workspace tests
        run: npx vitest run src/components/courts/AdvancedFibaCourt.test.tsx
      - name: Full unit suite
        run: npm test
      - name: TypeScript and Vite build
        run: npm run build
