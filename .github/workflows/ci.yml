name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Session timeline tests
        run: npx vitest run src/modules/sessions/SessionTimeline.test.tsx
      - name: Court add-frame test
        run: npx vitest run src/components/courts/AdvancedFibaCourt.test.tsx -t "ajoute une frame vierge"
      - name: Court duplicate-frame test
        run: npx vitest run src/components/courts/AdvancedFibaCourt.test.tsx -t "duplique le contenu"
      - name: Court tab-panel test
        run: npx vitest run src/components/courts/AdvancedFibaCourt.test.tsx -t "relie la frame active"
      - name: Court orientation test
        run: npx vitest run src/components/courts/AdvancedFibaCourt.test.tsx -t "changement d’orientation"
      - name: Court reset test
        run: npx vitest run src/components/courts/AdvancedFibaCourt.test.tsx -t "réinitialise la frame"
      - name: Source unit suite
        run: npx vitest run src
      - name: Repository test suite
        run: npx vitest run tests
      - name: TypeScript and Vite build
        run: npm run build
